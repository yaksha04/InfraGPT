apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infragpt-agent-rolebinding
  labels:
    app.kubernetes.io/name: infragpt
subjects:
  - kind: ServiceAccount
    name: infragpt-agent-sa
    namespace: infragpt-system
roleRef:
  kind: ClusterRole
  name: infragpt-agent-role
  apiGroup: rbac.authorization.k8s.io
