apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: production
  labels:
    app: inventory-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              MEM_LIMIT=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "0");
              if [ "$MEM_LIMIT" -le 350000000 ] 2>/dev/null && [ "$MEM_LIMIT" -gt 0 ] 2>/dev/null; then
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR java.lang.OutOfMemoryError: Inventory cache memory limit (256Mi) exceeded (requires 512Mi)";
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] FATAL Exit Code 137 (OOMKilled)";
                sleep 2;
                exit 137;
              elif [ -z "$DB_CONNECTION_STRING" ]; then
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR FATAL: Missing mandatory environment variable DB_CONNECTION_STRING";
                sleep 2;
                exit 1;
              else
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] INFO Memory verified ($(($MEM_LIMIT/1024/1024))MB) and DB connected. InventoryService healthy!";
                exec sleep 86400;
              fi
          resources:
            limits:
              memory: "256Mi"
              cpu: "100m"
