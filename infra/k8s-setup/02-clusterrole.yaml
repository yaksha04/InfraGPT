apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infragpt-agent-role
  labels:
    app.kubernetes.io/name: infragpt
    app.kubernetes.io/part-of: infragpt-security
rules:
  # 🟢 READ PERMISSIONS (Inspection, Logs, Events, Topology)
  - apiGroups: [""]
    resources: ["pods", "services", "namespaces", "nodes", "events", "configmaps"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods/log", "pods/status"]
    verbs: ["get"]

  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

  # 🔴 WRITE PERMISSIONS (Guarded by HITL Safety Gate in Orchestrator)
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["patch", "update"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
