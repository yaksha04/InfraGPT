apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: production
  labels:
    app: order-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -n "$REDIS_HOST" ]; then
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] INFO REDIS_HOST detected ($REDIS_HOST). Cache cluster connected.";
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] INFO OrderService v2.4.0 started and healthy on port 8080.";
                exec sleep 86400;
              else
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] INFO OrderService starting...";
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR RedisConnectionException: Unable to connect to redis-master:6379";
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] FATAL Mandatory environment variable REDIS_HOST is missing!";
                sleep 2;
                exit 1;
              fi
          resources:
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: production
  labels:
    app: notification-service
    tier: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          # Deliberately invalid image tag to trigger ImagePullBackOff
          image: nginx:v999-broken-tag
          resources:
            limits:
              memory: "256Mi"
              cpu: "100m"
