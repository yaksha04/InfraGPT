apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-auth-service
  namespace: production
  labels:
    app: user-auth-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-auth-service
  template:
    metadata:
      labels:
        app: user-auth-service
    spec:
      containers:
        - name: auth-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "200m"
